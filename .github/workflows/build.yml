name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SDCC
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sdcc

      - name: Build all boards
        run: |
          sdcc --version | head -n 1
          make dist
          cat dist/SHA256SUMS

      - name: Check the tag matches the firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(make -s version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version in firmware/relay04.c"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: relay04-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relay04-${{ github.sha }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
